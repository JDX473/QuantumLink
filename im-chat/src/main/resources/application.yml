server:
  port: 8081

spring:
  application:
    name: im-chat
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本机 MySQL:3306,root/123456,库 quantumlink(独立库,与旧项目 im 隔离)
    # 注意:Connector/J 8.3 的 characterEncoding 只认 utf8(MySQL 的 utf8 即 utf8mb4)
    url: jdbc:mysql://127.0.0.1:3306/quantumlink?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  data:
    redis:
      host: 127.0.0.1
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# RocketMQ 配置(本机 namesrv)
rocketmq:
  name-server: 127.0.0.1:9876
  producer-group: im-chat-producer
  topics:
    upstream: client2server     # connect → chat(上行)
    downstream: server2client   # chat → connect(下行)

# MinIO 对象存储(头像)
# 注意:key 用 accessKey/secretKey(不用 access-key),避免与系统环境变量 MINIO_ACCESS_KEY 冲突
minio:
  endpoint: http://127.0.0.1:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucket: avatar

# Nacos 服务注册中心:connect 启动注册 im-connect 实例,chat 查询做服务发现
# + 最少连接调度(替代旧的静态 connect.nodes 配置)
nacos:
  server-addr: 127.0.0.1:8850
