version: "3.8"

# QuantumLink IM 中间件编排(MVP 精简版)
# MySQL 8 / Redis 7 / RocketMQ 5(4.9 兼容镜像)/ Nacos 2.5(骨架,MVP 后置可不用)
# 参考旧 E:\webchat-docker,仅保留 MVP 必需。

services:
  mysql:
    image: mysql:8.0
    container_name: ql-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: im
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ql-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0
    container_name: ql-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ql-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rmqnamesrv:
    image: apache/rocketmq:5.2.0
    container_name: ql-rmqnamesrv
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    volumes:
      - ql-rmqnamesrv-logs:/home/rocketmq/logs
      - ql-rmqnamesrv-store:/home/rocketmq/store
    healthcheck:
      test: ["CMD", "bash", "-c", "grep -q 'boot success' /home/rocketmq/logs/namesrv.log || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  rmqbroker:
    image: apache/rocketmq:5.2.0
    container_name: ql-rmqbroker
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command: sh mqbroker -n namesrv:9876 -c /home/rocketmq/conf/broker.conf
    ports:
      - "10911:10911"
      - "10909:10909"
    volumes:
      - ./broker.conf:/home/rocketmq/conf/broker.conf:ro
      - ql-rmqbroker-logs:/home/rocketmq/logs
      - ql-rmqbroker-store:/home/rocketmq/store
    depends_on:
      - rmqnamesrv
    healthcheck:
      test: ["CMD", "bash", "-c", "grep -q 'boot success' /home/rocketmq/logs/broker.log || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.5.0
    container_name: ql-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - ql-nacos-data:/home/nacos/data

volumes:
  ql-mysql-data:
  ql-redis-data:
  ql-rmqnamesrv-logs:
  ql-rmqnamesrv-store:
  ql-rmqbroker-logs:
  ql-rmqbroker-store:
  ql-nacos-data:
