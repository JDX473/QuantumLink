# RocketMQ broker 配置(host 模式用宿主机 IP 保证客户端可达)
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
# 关键:broker 注册到 namesrv 的地址。Docker 内网桥接时,客户端(宿主机)需经此地址访问 broker。
# 生产建议填宿主机局域网 IP;本地单机填 127.0.0.1 即可(客户端也在本机)。
brokerIP1=127.0.0.1
# 自动创建 topic(便于本地开发,生产应显式建)
autoCreateTopicEnable=true
